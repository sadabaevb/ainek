[package]
name = "ainek-policy"
description = "Ainek policy job for OutLayer (WASI P1): stdin JSON -> signed decision on stdout"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/sadabaevb/ainek"

# OutLayer runs a plain WASI command (`main`), so this must be a binary, not a library.
[[bin]]
name = "ainek-policy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The decision is signed with the key OutLayer generates inside the TEE (`PROTECTED_ED25519`, base58 seed).
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
