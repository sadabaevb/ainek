# Builds the verifier image and, on main, publishes it to GitHub's registry, so that someone outside the team can run a
# verifier without cloning the repo (services/verifier/README.md). The package is private until its visibility is set
# to public once in the package settings on GitHub.
name: verifier-image

on:
  push:
    branches: [main]
    paths: ['services/verifier/**', 'packages/proof/**', 'docs/samples/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', '.dockerignore', '.github/workflows/verifier-image.yml']
  pull_request:
    paths: ['services/verifier/**', 'packages/proof/**', 'docs/samples/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', '.dockerignore', '.github/workflows/verifier-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two quick pushes to main must not leave `latest` on the older commit.
concurrency:
  group: verifier-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sadabaevb/ainek-verifier

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f services/verifier/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
      # The image must do a real round before it is published: a live re-attestation with a fresh nonce that sends
      # nothing and needs no account. It fails when NEAR AI Cloud is unreachable; rerun the job then.
      - name: Dry run
        run: docker run --rm "$IMAGE:latest" --dry-run
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
