[package]
name = "ainek-policy"
description = "Ainek policy job for OutLayer (WASI P1): stdin JSON -> signed decision on stdout"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/sadabaevb/ainek"

# OutLayer runs a plain WASI command (`main`), so this must be a binary, not a library.
[[bin]]
name = "ainek-policy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
